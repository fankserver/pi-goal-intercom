name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check
      - name: dist/ is committed and matches src/
        run: |
          npm run build >/dev/null
          git diff --exit-code dist/ || {
            echo "::error::dist/index.ts is stale — run 'npm run build' and commit it."
            exit 1
          }
